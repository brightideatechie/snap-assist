name: snap_assist
description: Portable SNAP Benefits Assistant – encrypted local work logging, document management, eligibility guidance, and benefits navigation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Encrypted local database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Encryption & security
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

  # Documents & OCR
  image_picker: ^1.1.2
  file_picker: ^8.0.3

  # Browser / WebView
  webview_flutter: ^4.8.0

  # Email / HTTP
  http: ^1.2.1
  url_launcher: ^6.3.0

  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/state_data/
